name: soil-workflow-1790339166194-base-pearson-correlation-707e873a

on:
    workflow_dispatch:
        inputs:
            OVERWRITTEN:
                description: "Overwritten fields"
                required: true
            PAYLOAD_URL:
                description: "URL to payload"
                required: true

jobs:
    run_docker_image:
        runs-on: ubuntu-latest
        container: ghcr.io/faasr/github-actions-python:latest

        env:
            GH_PAT: ${{ secrets.GH_PAT}}
            S3_AccessKey: ${{ secrets.S3_AccessKey}}
            S3_SecretKey: ${{ secrets.S3_SecretKey}}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID}}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
            CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN}}
            NOAA_CDO_TOKEN: ${{ secrets.NOAA_CDO_TOKEN}}
            OVERWRITTEN: ${{ github.event.inputs.OVERWRITTEN }}
            PAYLOAD_URL: ${{ github.event.inputs.PAYLOAD_URL }}

        steps:
          - name: Run Python entrypoint
            run: |
                cd /action
                python3 faasr_entry.py
